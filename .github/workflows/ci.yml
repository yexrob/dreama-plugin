name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  # Always runs, no external checkout: manifest shape, i18n key coverage and
  # index.json / dist consistency.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run lint

  # Needs the Dreama checkout for tools/plugin-kit (the authoritative runtime).
  # Skipped until the repository variable DREAMA_REPO is configured.
  test:
    if: vars.DREAMA_REPO != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: plugins

      - uses: actions/checkout@v4
        with:
          repository: ${{ vars.DREAMA_REPO }}
          path: dreama
          # A private Dreama needs a PAT here (the default GITHUB_TOKEN cannot
          # see other repositories):
          # token: ${{ secrets.DREAMA_READ_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dreama/tools/plugin-kit/package-lock.json

      - name: Install plugin-kit
        working-directory: dreama/tools/plugin-kit
        run: npm ci

      - name: Offline regression tests
        working-directory: plugins
        env:
          DREAMA_KIT: ${{ github.workspace }}/dreama/tools/plugin-kit
        run: npm test

      - name: Verify dist/ and index.json are up to date
        working-directory: plugins
        env:
          DREAMA_KIT: ${{ github.workspace }}/dreama/tools/plugin-kit
        run: npm run verify
