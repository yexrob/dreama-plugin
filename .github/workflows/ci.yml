name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Always runs, no external checkout: manifest shape, i18n key coverage and
  # index.json / dist consistency.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run lint

  # Needs the depth3d checkout for tools/plugin-kit (the authoritative runtime).
  # Skipped until the repository variable DEPTH3D_REPO is configured.
  test:
    if: vars.DEPTH3D_REPO != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: plugins

      - uses: actions/checkout@v4
        with:
          repository: ${{ vars.DEPTH3D_REPO }}
          path: depth3d
          # A private depth3d needs a PAT here (the default GITHUB_TOKEN cannot
          # see other repositories):
          # token: ${{ secrets.DEPTH3D_READ_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: depth3d/tools/plugin-kit/package-lock.json

      - name: Install plugin-kit
        working-directory: depth3d/tools/plugin-kit
        run: npm ci

      - name: Offline regression tests
        working-directory: plugins
        env:
          DEPTH3D_KIT: ${{ github.workspace }}/depth3d/tools/plugin-kit
        run: npm test

      - name: Verify dist/ and index.json are up to date
        working-directory: plugins
        env:
          DEPTH3D_KIT: ${{ github.workspace }}/depth3d/tools/plugin-kit
        run: npm run verify
